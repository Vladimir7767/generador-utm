<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Generador de Enlaces UTM Gratis</title>
<style>
body{font-family:'Segoe UI',sans-serif;background:#f4f6f9;margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#fff;padding:25px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.05);max-width:440px;width:100%}
h2{text-align:center;margin-top:0}
input{width:100%;padding:10px;margin:8px 0;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box;font-size:14px}
button{width:100%;padding:12px;background:#0284c7;border:none;color:#fff;font-weight:bold;border-radius:6px;cursor:pointer;margin-top:10px}
.res{margin-top:20px;padding:15px;display:none;background:#f0f9ff;border:1px solid #bae6fd;border-radius:6px;word-break:break-all}
.ad{display:none;margin-top:15px;min-height:100px;text-align:center}
</style>
</head>
<body>
<div class="box">
<h2>Generador UTM</h2>
<input type="url" id="url" placeholder="URL del Sitio (https://...)">
<input type="text" id="src" placeholder="Fuente (utm_source)">
<input type="text" id="med" placeholder="Medio (utm_medium)">
<input type="text" id="cam" placeholder="Campaña (utm_campaign)">
<button onclick="makeUTM()">Generar Enlace</button>
<div id="resBox" class="res"><strong>¡Creado!</strong><div id="out" style="margin-top:8px;background:#fff;padding:8px;border:1px solid #cbd5e1;border-radius:4px;font-size:13px"></div></div>
<div id="ads" class="ad"><div id="container-e8c895e6c70ade8e4ef4a72354f42e97"></div></div>
</div>
<script>
function showAds(){
const c=document.getElementById('ads');
if(!window.adScriptLoaded){
window.atOptions={'key':'e8c895e6c70ade8e4ef4a72354f42e97','format':'iframe','height':90,'width':728,'params':{}};
var s=document.createElement('script');s.type='text/javascript';s.async=!0;
s.src=['https://','bagelstoppage.','com/','e8c895e6c70ade8e4ef4a72354f42e97/','invoke.js'].join('');
c.appendChild(s);window.adScriptLoaded=!0
}
c.style.display='block'
}
function makeUTM(){
let u=document.getElementById('url').value.trim();
const s=document.getElementById('src').value.trim(),m=document.getElementById('med').value.trim(),c=document.getElementById('cam').value.trim();
if(!u||!s||!m||!c){alert('Complete campos');return}
if(!/^https?:\/\//i.test(u))u='https://'+u;
try{
let o=new URL(u);o.searchParams.set('utm_source',s);o.searchParams.set('utm_medium',m);o.searchParams.set('utm_campaign',c);
document.getElementById('out').innerText=o.toString();
document.getElementById('resBox').style.display='block';showAds()
}catch(e){alert('URL invalida')}
}
</script>
</body>
</html>
